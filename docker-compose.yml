services:
  postgres:
    image: postgres:16-alpine
    container_name: ecommerce-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ecommerce}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecommerce}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/init-dbs.sql:/docker-entrypoint-initdb.d/init-dbs.sql:ro

  kafka:
    image: bitnami/kafka:3.7
    container_name: ecommerce-kafka
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"

  # Descomenta cuando tengas los servicios listos para dockerizar
  # api-gateway:
  #   build: ./api-gateway
  #   ports: ["8080:8080"]
  # auth-service:
  #   build: ./auth-service
  #   ports: ["8081:8081"]
  # catalogo-service:
  #   build: ./catalogo-service
  #   ports: ["8082:8082"]
  # pedidos-service:
  #   build: ./pedidos-service
  #   ports: ["8083:8083"]
  # pagos-service:
  #   build: ./pagos-service
  #   ports: ["8084:8084"]
  # notificaciones-service:
  #   build: ./notificaciones-service
  #   ports: ["8085:8085"]

volumes:
  postgres_data:
